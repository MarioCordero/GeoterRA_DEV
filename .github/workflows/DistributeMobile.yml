name: MOBILE - Distribución de Mobile a Develop, Main y Web

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-mobile:
    name: Sincronizar carpeta Mobile/
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Configurar identidad de Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin

      # ------------------------------------------------------------------------
      # 1. Sincronizar carpeta Mobile/ en rama develop
      # ------------------------------------------------------------------------
      - name: Sincronizar Mobile/ en develop
        run: |
          echo "🔄 Sincronizando Mobile/ en develop..."
          
          # Detectar si la rama remota es 'Mobile' o 'mobile'
          SRC_BRANCH="mobile"
          if git show-ref --verify --quiet refs/remotes/origin/Mobile; then
            SRC_BRANCH="Mobile"
          fi

          git fetch origin develop
          git checkout -B develop origin/develop
          
          rm -rf Mobile/
          git checkout "origin/$SRC_BRANCH" -- Mobile/
          git add Mobile/

          if ! git diff --cached --quiet; then
            git commit -m "📱 CI: Sincronización automática de Mobile/ desde rama $SRC_BRANCH [skip ci]"
            git pull --rebase origin develop
            git push origin develop
            echo "✅ Mobile/ sincronizado en develop exitosamente."
          else
            echo "ℹ️ No hay cambios en Mobile/ para la rama develop."
          fi

      # ------------------------------------------------------------------------
      # 2. Sincronizar carpeta Mobile/ en rama web
      # ------------------------------------------------------------------------
      - name: Sincronizar Mobile/ en web
        run: |
          echo "🔄 Sincronizando Mobile/ en web..."
          
          # Detectar si la rama remota es 'Mobile' o 'mobile'
          SRC_BRANCH="mobile"
          if git show-ref --verify --quiet refs/remotes/origin/Mobile; then
            SRC_BRANCH="Mobile"
          fi

          git fetch origin web
          git checkout -B web origin/web
          
          rm -rf Mobile/
          git checkout "origin/$SRC_BRANCH" -- Mobile/
          git add Mobile/

          if ! git diff --cached --quiet; then
            git commit -m "📱 CI: Sincronización automática de Mobile/ desde rama $SRC_BRANCH [skip ci]"
            git pull --rebase origin web
            git push origin web
            echo "✅ Mobile/ sincronizado en web exitosamente."
          else
            echo "ℹ️ No hay cambios en Mobile/ para la rama web."
          fi

      # ------------------------------------------------------------------------
      # 3. Sincronizar carpeta Mobile/ en rama main
      # ------------------------------------------------------------------------
      - name: Sincronizar Mobile/ en main
        run: |
          echo "🔄 Sincronizando Mobile/ en main..."
          
          # Detectar si la rama remota es 'Mobile' o 'mobile'
          SRC_BRANCH="mobile"
          if git show-ref --verify --quiet refs/remotes/origin/Mobile; then
            SRC_BRANCH="Mobile"
          fi

          git fetch origin main
          git checkout -B main origin/main
          
          rm -rf Mobile/
          git checkout "origin/$SRC_BRANCH" -- Mobile/
          git add Mobile/

          if ! git diff --cached --quiet; then
            git commit -m "📱 CI: Sincronización automática de Mobile/ desde rama $SRC_BRANCH [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "✅ Mobile/ sincronizado en main exitosamente."
          else
            echo "ℹ️ No hay cambios en Mobile/ para la rama main."
          fi

      # ------------------------------------------------------------------------
      # 4. Notificar al servidor de producción para desplegar la actualización
      # ------------------------------------------------------------------------
      - name: Actualizar servidor de producción (SERVER.pull.sh)
        run: |
          echo "🚀 Notificando al servidor de producción para ejecutar git pull..."
          OUTPUT=$(curl -k -sS --max-time 120 https://163.178.171.105/cgi-bin/SERVER.pull.sh)
          echo "$OUTPUT"

          if ! echo "$OUTPUT" | grep -q "Actualización completada con éxito"; then
            echo "::error::SERVER.pull.sh no terminó correctamente en el servidor."
            exit 1
          fi
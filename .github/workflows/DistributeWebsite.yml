name: WEBSITE - Build y Distribución de Website a Develop y Main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync-website:
    name: Build y Distribución de Website
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio (rama web)
        uses: actions/checkout@v4
        with:
          ref: web
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Instalar Dependencias y Construir Frontend
        working-directory: ./website
        run: |
          npm ci || npm install
          npm run build

      - name: Respaldar build temporalmente
        run: |
          mkdir -p /tmp/website_dist
          cp -r website/dist/. /tmp/website_dist/
          echo "📦 Contenido del build generado en website/dist/:"
          ls -la /tmp/website_dist

      - name: Configurar identidad de Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin

      # ------------------------------------------------------------------------
      # 1. Sincronizar carpeta website/ en rama develop (código fuente)
      # ------------------------------------------------------------------------
      - name: Sincronizar website/ en develop
        run: |
          echo "🔄 Sincronizando website/ en develop..."
          git checkout develop || git checkout -b develop origin/develop
          
          rm -rf website/
          git checkout origin/web -- website/
          git add website/

          if ! git diff --cached --quiet; then
            git commit -m "🌐 CI: Sincronización automática de website/ desde rama web [skip ci]"
            git push origin develop
            echo "✅ website/ sincronizado en develop exitosamente."
          else
            echo "ℹ️ No hay cambios en website/ para la rama develop."
          fi

      # ------------------------------------------------------------------------
      # 2. Sincronizar carpeta website/ y build de producción en rama main
      # ------------------------------------------------------------------------
      - name: Sincronizar website/ y dist en main
        run: |
          echo "🔄 Sincronizando website/ y dist/ en main..."
          git checkout main || git checkout -b main origin/main
          
          # 1. Sincronizar código fuente desde origin/web
          rm -rf website/
          git checkout origin/web -- website/
          
          # 2. Restaurar la distribución compilada en website/dist/
          rm -rf website/dist
          mkdir -p website/dist
          cp -r /tmp/website_dist/. website/dist/
          
          # 3. Registrar cambios en git (forzando dist/ ya que está en .gitignore)
          git add website/
          git add -f website/dist/
          git add -u website/dist/

          if ! git diff --cached --quiet; then
            git commit -m "🌐 CI: Sincronización automática de website/ y build de producción en main [skip ci]"
            git push origin main
            echo "✅ website/ y dist/ sincronizados en main exitosamente."
          else
            echo "ℹ️ No hay cambios en website/ ni dist/ para la rama main."
          fi

      # ------------------------------------------------------------------------
      # 3. Notificar al servidor de producción para desplegar la actualización
      # ------------------------------------------------------------------------
      - name: Actualizar servidor de producción (SERVER.pull.sh)
        run: |
          echo "🚀 Notificando al servidor de producción para ejecutar git pull..."
          OUTPUT=$(curl -k -sS --max-time 120 https://163.178.171.105/cgi-bin/SERVER.pull.sh)
          echo "$OUTPUT"

          if ! echo "$OUTPUT" | grep -q "Actualización completada con éxito"; then
            echo "::error::SERVER.pull.sh no terminó correctamente en el servidor."
            exit 1
          fi

      # ------------------------------------------------------------------------
      # 4. Verificar que el servidor generó /config.js con la API key (runtime config)
      #    La clave vive en /home/proyecto/.env y SERVER.pull.sh la inyecta tras
      #    cada pull. Si no está, todo el sitio respondería 403 (Invalid API Key).
      # ------------------------------------------------------------------------
      - name: Verificar config.js en producción
        run: |
          CONFIG=$(curl -k -sS --max-time 30 "https://geoterra.inii.ucr.ac.cr/config.js?t=$(date +%s)")

          if echo "$CONFIG" | grep -q 'API_KEY: "[^"]\+"'; then
            echo "✅ config.js en producción contiene API_KEY (el valor no se imprime)."
          else
            echo "::error::config.js en producción NO contiene API_KEY."
            echo "Revisa que /var/www/cgi-bin/SERVER.pull.sh sea la versión nueva y que"
            echo "/home/proyecto/.env tenga VITE_API_KEY y sea legible por el usuario del CGI."
            exit 1
          fi
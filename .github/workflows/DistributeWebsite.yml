name: TODO WEBSITE - Build y Distribución de Website a Develop y Main

on:
  push:
    branches:
      - web
    paths:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync-website:
    name: Build y Distribución de Website
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio (rama web)
        uses: actions/checkout@v4
        with:
          ref: web
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependencias y Construir Frontend
        working-directory: ./website
        run: |
          npm ci || npm install
          npm run build

      - name: Configurar identidad de Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin

      # ------------------------------------------------------------------------
      # 1. Sincronizar carpeta website/ en rama develop
      # ------------------------------------------------------------------------
      - name: Sincronizar website/ en develop
        run: |
          echo "🔄 Sincronizando website/ en develop..."
          git checkout develop || git checkout -b develop origin/develop
          
          rm -rf website/
          git checkout origin/web -- website/
          git add website/

          if ! git diff --cached --quiet; then
            git commit -m "🌐 CI: Sincronización automática de website/ desde rama web [skip ci]"
            git push origin develop
            echo "✅ website/ sincronizado en develop exitosamente."
          else
            echo "ℹ️ No hay cambios en website/ para la rama develop."
          fi

      # ------------------------------------------------------------------------
      # 2. Sincronizar carpeta website/ y build de producción en rama main
      # ------------------------------------------------------------------------
      - name: Sincronizar website/ en main
        run: |
          echo "🔄 Sincronizando website/ en main..."
          git checkout main || git checkout -b main origin/main
          
          rm -rf website/
          git checkout origin/web -- website/
          
          # Inyectar el build compilado en website/dist
          git checkout origin/web -- website/
          git add website/

          if ! git diff --cached --quiet; then
            git commit -m "🌐 CI: Sincronización automática de website/ desde rama web [skip ci]"
            git push origin main
            echo "✅ website/ sincronizado en main exitosamente."
          else
            echo "ℹ️ No hay cambios en website/ para la rama main."
          fi